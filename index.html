<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Nave Espacial</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at top, #F1BEBE, #D8D8D8);
            color: #488399;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-shell {
            width: 760px;
            max-width: 100%;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            letter-spacing: 1px;
            color: #488399;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(#D8D8D8, #F1BEBE 80%);
            border: 4px solid #488399;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(72, 131, 153, 0.35);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 10px 16px;
            background: rgba(72, 131, 153, 0.12);
            border-radius: 12px;
            box-shadow: inset 0 0 50px rgba(72, 131, 153, 0.1);
        }

        .status-bar span {
            font-size: 16px;
        }

        .hp span {
            margin-right: 4px;
            color: #EA9393;
        }

        .controls {
            margin-top: 12px;
            font-size: 14px;
            color: #488399;
        }

        .controls strong {
            color: #EA9393;
        }

        .footer {
            margin-top: 12px;
            color: #488399;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <h1>Jogo da Nave Espacial</h1>
        <canvas id="gameCanvas" width="700" height="500"></canvas>
        <div class="status-bar">
            <span id="scoreText">Pontos: 0</span>
            <span class="hp" id="hpText">HP: <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></span>
            <span id="modeText">Modo: Normal</span>
        </div>
        <div class="controls">
            Controle: <strong>A</strong> = esquerda, <strong>D</strong> = direita. O tiro é automático.
        </div>
        <div class="footer">
            Abra este arquivo em um navegador para jogar. Pressione <strong>R</strong> para reiniciar após o game over.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const hpText = document.getElementById('hpText');
        const modeText = document.getElementById('modeText');

        const GAME_WIDTH = canvas.width;
        const GAME_HEIGHT = canvas.height;
        const SHIP_WIDTH = 48;
        const SHIP_HEIGHT = 18;
        const SHIP_Y = GAME_HEIGHT - SHIP_HEIGHT - 20;
        const MAX_HP = 5;
        const BULLET_SPEED = 8;
        const ASTEROID_SPEED = 2;
        const ASTEROID_SPAWN_MS = 600;
        const BULLET_INTERVAL_MS = 180;
        const LASER_DURATION_MS = 2000;

        let shipX;
        let keys = { a: false, d: false };
        let bullets = [];
        let asteroids = [];
        let score = 0;
        let hp = MAX_HP;
        let lastBulletTime = 0;
        let lastAsteroidTime = 0;
        let gameOver = false;
        let laserActive = false;
        let laserEndTime = 0;
        let laserUsed = false;

        function resetGame() {
            shipX = GAME_WIDTH / 2 - SHIP_WIDTH / 2;
            bullets = [];
            asteroids = [];
            score = 0;
            hp = MAX_HP;
            gameOver = false;
            laserActive = false;
            laserUsed = false;
            lastBulletTime = Date.now();
            lastAsteroidTime = Date.now();
            updateStatus();
        }

        function updateStatus() {
            scoreText.textContent = `Pontos: ${score}`;
            hpText.innerHTML = '';
            for (let i = 0; i < hp; i++) {
                const heart = document.createElement('span');
                heart.textContent = '♥';
                hpText.appendChild(heart);
            }
            modeText.textContent = laserActive ? 'Modo: Laser ativo' : (laserUsed ? 'Modo: Normal' : 'Modo: Normal');
        }

        function spawnAsteroid() {
            const points = Math.floor(Math.random() * 5) + 1;
            const hpValue = points >= 3 ? 2 : 1;
            asteroids.push({
                x: Math.random() * (GAME_WIDTH - 40) + 20,
                y: -30,
                radius: 20 + points * 2,
                points,
                hp: hpValue
            });
        }

        function drawShip() {
            ctx.save();
            ctx.fillStyle = '#488399';
            ctx.beginPath();
            ctx.moveTo(shipX + SHIP_WIDTH / 2, SHIP_Y);
            ctx.lineTo(shipX + SHIP_WIDTH, SHIP_Y + SHIP_HEIGHT);
            ctx.lineTo(shipX, SHIP_Y + SHIP_HEIGHT);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#F4D38A';
            ctx.fillRect(shipX + SHIP_WIDTH * 0.35, SHIP_Y + 4, SHIP_WIDTH * 0.3, SHIP_HEIGHT - 8);
            ctx.restore();
        }

        function drawBullet(bullet) {
            ctx.save();
            ctx.strokeStyle = '#488399';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(bullet.x, bullet.y);
            ctx.lineTo(bullet.x, bullet.y - 12);
            ctx.stroke();
            ctx.restore();
        }

        function drawAsteroid(asteroid) {
            ctx.save();
            const gradient = ctx.createRadialGradient(asteroid.x - 8, asteroid.y - 8, 2, asteroid.x, asteroid.y, asteroid.radius);
            gradient.addColorStop(0, '#F1BEBE');
            gradient.addColorStop(0.7, '#EA9393');
            gradient.addColorStop(1, '#F4D38A');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(asteroid.x, asteroid.y, asteroid.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(72, 131, 153, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#488399';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(asteroid.points, asteroid.x, asteroid.y);
            ctx.restore();
        }

        function drawLaser() {
            ctx.save();
            ctx.strokeStyle = 'rgba(72,131,153,0.85)';
            ctx.lineWidth = 8;
            ctx.shadowColor = '#488399';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(shipX + SHIP_WIDTH / 2, SHIP_Y + 2);
            ctx.lineTo(shipX + SHIP_WIDTH / 2, 0);
            ctx.stroke();
            ctx.restore();
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            gradient.addColorStop(0, '#020517');
            gradient.addColorStop(1, '#041129');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        function gameLoop() {
            const now = Date.now();
            if (!gameOver) {
                const delta = now - lastBulletTime;
                if (keys.a) shipX -= 7;
                if (keys.d) shipX += 7;
                shipX = Math.max(10, Math.min(GAME_WIDTH - SHIP_WIDTH - 10, shipX));

                if (now - lastBulletTime >= BULLET_INTERVAL_MS) {
                    bullets.push({ x: shipX + SHIP_WIDTH / 2, y: SHIP_Y });
                    lastBulletTime = now;
                }
                if (now - lastAsteroidTime >= ASTEROID_SPAWN_MS) {
                    spawnAsteroid();
                    lastAsteroidTime = now;
                }

                bullets = bullets.filter(bullet => bullet.y > -10);
                bullets.forEach(bullet => bullet.y -= BULLET_SPEED);

                asteroids.forEach(asteroid => asteroid.y += ASTEROID_SPEED);
                asteroids = asteroids.filter(asteroid => asteroid.y - asteroid.radius < GAME_HEIGHT + 20);

                bullets.forEach((bullet, bulletIndex) => {
                    asteroids.forEach((asteroid, asteroidIndex) => {
                        const dx = bullet.x - asteroid.x;
                        const dy = bullet.y - asteroid.y;
                        if (Math.sqrt(dx * dx + dy * dy) < asteroid.radius + 4) {
                            if (!laserActive) {
                                asteroid.hp -= 1;
                            }
                            bullets[bulletIndex].y = -999;
                        }
                    });
                });

                asteroids = asteroids.filter((asteroid, index) => {
                    if (laserActive && Math.abs(asteroid.x - (shipX + SHIP_WIDTH / 2)) < asteroid.radius + 8 && asteroid.y < SHIP_Y) {
                        score += asteroid.points;
                        return false;
                    }
                    if (asteroid.hp <= 0) {
                        score += asteroid.points;
                        return false;
                    }
                    return true;
                });

                asteroids = asteroids.filter(asteroid => {
                    const dx = asteroid.x - (shipX + SHIP_WIDTH / 2);
                    const dy = asteroid.y - (SHIP_Y + SHIP_HEIGHT / 2);
                    if (Math.sqrt(dx * dx + dy * dy) < asteroid.radius + 10) {
                        hp -= 1;
                        return false;
                    }
                    return true;
                });

                if (score >= 40 && !laserUsed) {
                    laserActive = true;
                    laserEndTime = now + LASER_DURATION_MS;
                    laserUsed = true;
                }
                if (laserActive && now >= laserEndTime) {
                    laserActive = false;
                }

                if (hp <= 0) {
                    gameOver = true;
                }
            }

            drawBackground();
            asteroids.forEach(drawAsteroid);
            bullets.forEach(drawBullet);
            if (laserActive) drawLaser();
            drawShip();

            updateStatus();

            if (gameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.fillRect(0, GAME_HEIGHT / 2 - 60, GAME_WIDTH, 120);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 6);
                ctx.font = '20px sans-serif';
                ctx.fillText(`Pontuação final: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 30);
                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', event => {
            if (event.key.toLowerCase() === 'a') keys.a = true;
            if (event.key.toLowerCase() === 'd') keys.d = true;
            if (event.key.toLowerCase() === 'r' && gameOver) resetGame();
        });

        window.addEventListener('keyup', event => {
            if (event.key.toLowerCase() === 'a') keys.a = false;
            if (event.key.toLowerCase() === 'd') keys.d = false;
        });

        resetGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
